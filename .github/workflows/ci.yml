# Native builds, compatibility and benchmarks.
#
# Native otter executables are built here, never on developer machines,
# until they can be code-signed (docs/ARCHITECTURE.md, phase 5). Only
# reports and captured program output are uploaded - never the binaries.
name: otter-net

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows - native build vs otterPS 1.0.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out otterPS 1.0.1 (the reference)
        uses: actions/checkout@v4
        with:
          repository: Heavens-Lava/otterPS
          ref: v1.0.1
          path: otterps
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish native (AOT)
        run: dotnet publish src/Otter.Cli/Otter.Cli.csproj -c Release -r win-x64 -p:UseAppHost=true -o artifacts/win-x64 --nologo
      - name: Compatibility - otterPS conformance, examples and tests/compat
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/compare.ps1 -OtterPs otterps -OtterNet artifacts/win-x64/otter.exe -ReportPath results/compat-windows.md
          powershell -NoProfile -ExecutionPolicy Bypass -Command "& tools/compare.ps1 -OtterPs otterps -OtterNet artifacts/win-x64/otter.exe -Corpus @(Get-ChildItem tests/compat -Filter 'net_*.ot' | ForEach-Object FullName) -IncludeEventPrograms -NativeOnly -ReportPath results/network-windows.md; exit `$LASTEXITCODE"

      - name: Native only - no program may need the PowerShell fallback
        # Not blocking yet: new on Windows PowerShell 5.1; made blocking once green.
        continue-on-error: true
        shell: powershell
        run: |
          # Report only (does not fail the job yet): which programs still need PowerShell.
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/port-progress.ps1 -OtterPs otterps -OtterNet artifacts/win-x64/otter.exe -ReportPath results/port-progress-windows.md
      - name: Command line - otter commands against otterPS 1.0.1
        # Not blocking yet: new on Windows PowerShell 5.1; made blocking once green.
        continue-on-error: true
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/compare-cli.ps1 -OtterPs otterps -OtterNet artifacts/win-x64/otter.exe -ReportPath results/cli-windows.md
      - name: Web - otter web pages byte for byte against otterPS 1.0.1
        # Not blocking yet: new on Windows PowerShell 5.1; made blocking once green.
        continue-on-error: true
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/compare-web.ps1 -OtterPs otterps -OtterNet artifacts/win-x64/otter.exe -ReportPath results/web-windows.md
      - name: Differential fuzz - otterPS's generators, 150 programs and 150 mutated
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/New-FuzzCorpus.ps1 -OtterPs otterps -OutputDirectory fuzz -Count 150 -Mutated
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/compare.ps1 -OtterPs otterps -OtterNet artifacts/win-x64/otter.exe -Corpus fuzz -TimeoutSeconds 20 -ReportPath results/fuzz-windows.md
      - name: Benchmarks against otterPS 1.0.1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/bench.ps1 -OtterPs otterps -OtterNet artifacts/win-x64/otter.exe -Runs 7 -ReportPath results/bench-windows.md
      - name: Capture reference output for the cross-platform check
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/capture.ps1 -Otter otterps/otter.ps1 -Corpus tests/compat -OutDir outputs/windows-otterps
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/capture.ps1 -Otter artifacts/win-x64/otter.exe -Corpus tests/compat -OutDir outputs/windows-native
      - name: Summary
        if: always()
        shell: powershell
        run: Get-ChildItem results -Filter *.md -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName; '' } | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows
          path: |
            results/
            outputs/

  other:
    name: ${{ matrix.name }} - native build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple silicon
            os: macos-latest
            rid: osx-arm64
            exe: otter
          - name: macOS Intel
            os: macos-15-intel
            rid: osx-x64
            exe: otter
          - name: Windows on Arm
            os: windows-11-arm
            rid: win-arm64
            exe: otter.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # The reference output is captured on a UTC machine, and JSON dates
      # depend on the time zone (docs/CROSS-PLATFORM-CONSISTENCY.md, 8).
      - name: Time zone UTC, like the reference
        if: runner.os == 'Windows'
        run: tzutil /s "UTC"
      - name: Publish native (AOT)
        run: dotnet publish src/Otter.Cli/Otter.Cli.csproj -c Release -r ${{ matrix.rid }} -p:UseAppHost=true -o artifacts/${{ matrix.rid }} --nologo
      - name: Capture output of tests/compat
        shell: pwsh
        run: ./tools/capture.ps1 -Otter artifacts/${{ matrix.rid }}/${{ matrix.exe }} -Corpus tests/compat -OutDir outputs/${{ matrix.rid }}
      - name: Startup and benchmark times
        shell: pwsh
        run: ./tools/bench-native.ps1 -Otter artifacts/${{ matrix.rid }}/${{ matrix.exe }} -Title "otter-net on ${{ matrix.name }} (${{ matrix.rid }})" -ReportPath results/bench-${{ matrix.rid }}.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.rid }}
          path: |
            results/
            outputs/

  # Linux is built and tested inside Debian 12, the system a Chromebook's
  # Linux development environment runs (on Intel and on Arm Chromebooks).
  # A Native AOT executable needs the C library it was linked against or a
  # newer one, so building on Debian 12 gives one Linux executable that runs
  # there and on current distributions alike.
  linux:
    name: Linux and Chromebooks (Debian 12, ${{ matrix.rid }}) - native build
    runs-on: ${{ matrix.os }}
    container: debian:bookworm
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
    env:
      DOTNET_ROOT: /usr/share/dotnet
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      # The PowerShell global tool may target an earlier .NET than the SDK.
      DOTNET_ROLL_FORWARD: Major
    defaults:
      run:
        shell: bash
    steps:
      - name: Native AOT prerequisites (clang, zlib) and the .NET 10 SDK
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git clang zlib1g-dev libicu72 libsqlite3-0
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- --channel 10.0 --install-dir "$DOTNET_ROOT"
          echo "$DOTNET_ROOT" >> "$GITHUB_PATH"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - name: PowerShell 7, for the test tools
        run: dotnet tool install --global PowerShell
      - name: Publish native (AOT)
        run: dotnet publish src/Otter.Cli/Otter.Cli.csproj -c Release -r ${{ matrix.rid }} -p:UseAppHost=true -o artifacts/${{ matrix.rid }} --nologo
      - name: Oldest C library the executable needs
        run: objdump -T artifacts/${{ matrix.rid }}/otter | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Capture output of tests/compat
        run: pwsh -NoProfile -File tools/capture.ps1 -Otter artifacts/${{ matrix.rid }}/otter -Corpus tests/compat -OutDir outputs/${{ matrix.rid }}
      - name: Startup and benchmark times
        run: pwsh -NoProfile -File tools/bench-native.ps1 -Otter artifacts/${{ matrix.rid }}/otter -Title "otter-net on Debian 12 (${{ matrix.rid }})" -ReportPath results/bench-${{ matrix.rid }}.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.rid }}
          path: |
            results/
            outputs/

  cross-platform:
    name: Same output on every platform
    needs: [windows, other, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
      - name: Compare with otterPS's output on Windows
        shell: pwsh
        run: |
          $reference = Get-Item downloaded/windows/outputs/windows-otterps
          $lines = @('# Cross-platform output check', '', "Reference: otterPS 1.0.1 on Windows. Line endings and the temporary folder's path are normalised.", '')
          $captured = [ordered]@{ 'windows-native' = 'downloaded/windows/outputs/windows-native' }
          foreach ($rid in 'osx-arm64', 'osx-x64', 'win-arm64', 'linux-x64', 'linux-arm64') { $captured[$rid] = "downloaded/$rid/outputs/$rid" }
          # Differences that are expected, with the reason. Any other
          # difference fails the check.
          $declared = @(
              @{ Platforms = 'osx-*', 'linux-*'; Programs = 'commands.ot'; Reason = 'runs cmd.exe and .cmd files: a Windows-only test' }
              @{ Platforms = 'osx-*', 'linux-*'; Programs = 'files_errors.ot', 'zip.ot', 'net_http_errors.ot'; Reason = 'paths in messages use the platform separator, / (docs/CROSS-PLATFORM-CONSISTENCY.md, 7)' }
              @{ Platforms = 'osx-*', 'linux-*'; Programs = 'sys_windows.ot', 'sys_print_notify.ot', 'sys_desktop.ot', 'sys_system_info.ot', 't3_system_tasks_printers.ot'; Reason = 'Windows-only features (registry, credentials, notifications, printing, event log, tasks) give otterPS''s "only available on Windows" message' }
              @{ Platforms = 'osx-*', 'linux-*'; Programs = 'sys_processes.ot', 'sys_ssh_arguments.ot'; Reason = 'the operating system''s own words for a missing program; otterPS looks for ssh.exe (SPEC-QUESTIONS Q8)' }
              @{ Platforms = '*'; Programs = 'ui_run_create.ot', 'ui_run_create_try.ot', 'ui_run_create_unknown.ot'; Reason = 'desktop windows (WPF): on Windows they need the PowerShell Otter (a decision pending, docs/port/desktop-options.md); elsewhere otterPS''s "could not start its UI provider"' }
              @{ Platforms = 'win-arm64'; Programs = 't3_system_tasks_printers.ot'; Reason = 'lists the names of the machine''s scheduled tasks and printers, and win-arm64 is another machine than the reference''s' }
              @{ Platforms = '*'; Programs = 'p2_remote_command.ot'; Reason = 'remote commands: on Windows they need the PowerShell Otter (a decision pending); elsewhere otterPS''s internal error (SPEC-QUESTIONS P2-1)' }
          )
          $failed = $false
          foreach ($platform in $captured.Keys) {
              $folder = Get-Item $captured[$platform] -ErrorAction SilentlyContinue
              if (-not $folder) { $lines += "- ${platform}: no output captured"; $failed = $true; continue }
              $different = @()
              foreach ($expected in Get-ChildItem $reference.FullName -Filter *.out) {
                  $actual = Join-Path $folder.FullName $expected.Name
                  if (-not (Test-Path $actual)) { $different += "$($expected.BaseName) (missing)"; continue }
                  if ((Get-Content -Raw $expected.FullName) -cne (Get-Content -Raw $actual)) { $different += $expected.BaseName }
              }
              $total = (Get-ChildItem $reference.FullName -Filter *.out).Count
              $expectedHere = @($different | Where-Object { $program = $_; $declared | Where-Object { $rule = $_; ($rule.Programs -contains $program) -and ($rule.Platforms | Where-Object { $platform -like $_ }) } })
              $unexpected = @($different | Where-Object { $expectedHere -notcontains $_ })
              if ($unexpected) { $failed = $true }
              $lines += "- ${platform}: $($total - $different.Count) of $total identical" +
                  $(if ($expectedHere) { ". Declared differences: " + ($expectedHere -join ', ') } else { '' }) +
                  $(if ($unexpected) { ". **Unexpected: " + ($unexpected -join ', ') + "**" } else { '' })
          }
          $lines += '' ; $lines += 'Declared differences:' ; $lines += @($declared | ForEach-Object { "- $($_.Programs -join ', ') on $($_.Platforms -join ', '): $($_.Reason)" })
          $lines | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $lines | Write-Host
          # A platform that produced nothing, or an undeclared difference, is a failure.
          if ($failed) { exit 1 }
